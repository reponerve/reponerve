name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify gofmt
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files require gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run tests (with race detection)
        if: matrix.os != 'windows-latest'
        run: go test -race -v -count=1 ./...

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: go test -v -count=1 ./...
